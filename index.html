<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - O'yinlar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .game-card {
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 30px -10px rgba(99, 102, 241, 0.4);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col justify-between">

    <!-- Navbar -->
    <header class="w-full p-5 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-bold text-indigo-500 text-3xl fa-gamepad animate-pulse"></i>
            <h1 class="text-2xl font-extrabold tracking-wider bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">
                GAME PORTAL
            </h1>
        </div>
        <div class="flex items-center space-x-2 text-sm text-slate-300">
            <span class="bg-indigo-600/20 border border-indigo-500/30 px-3 py-1 rounded-full text-indigo-300">🇺🇿 / 🇬🇧</span>
        </div>
    </header>

    <!-- Asosiy menyu -->
    <main class="max-w-5xl mx-auto px-4 py-12 w-full flex-grow">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-black mb-3">Oʻyinni tanlang</h2>
            <p class="text-slate-400 max-w-lg mx-auto">
                Oʻzingizga qulay o'yinni tanlang va boshlang!
            </p>
        </div>

        <!-- Kartochkalar -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 1. O'ZBEKCHA O'YIN (game1.html) -->
            <div class="game-card rounded-2xl p-6 flex flex-col justify-between border-t-4 border-t-emerald-500">
                <div>
                    <div class="w-full h-44 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-700 flex items-center justify-center mb-5 text-6xl shadow-lg">
                        🇺🇿
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs uppercase font-bold tracking-wider px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">1-O'yin</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-2 text-white">Oʻzbekcha Oʻyin</h3>
                    <p class="text-slate-400 text-sm mb-6">
                        
                    </p>
                </div>
                <button onclick="startGame('uz')" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 font-bold text-white shadow-lg transition active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Oʻyinni boshlash</span>
                </button>
            </div>

            <!-- 2. INGLIZCHA O'YIN (game2.html) -->
            <div class="game-card rounded-2xl p-6 flex flex-col justify-between border-t-4 border-t-indigo-500">
                <div>
                    <div class="w-full h-44 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-700 flex items-center justify-center mb-5 text-6xl shadow-lg">
                        🇬🇧
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs uppercase font-bold tracking-wider px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">2-O'yin</span>
                    </div>
                    <h3 class="text-2xl font-bold mb-2 text-white">English Game</h3>
                    <p class="text-slate-400 text-sm mb-6">
                        
                    </p>
                </div>
                <button onclick="startGame('en')" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 font-bold text-white shadow-lg transition active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>Start Game</span>
                </button>
            </div>

        </div>
    </main>

    <!-- O'YIN OYNASI (Modal) -->
    <div id="gameModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-lg hidden flex-col z-50">
        <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
            <h2 id="currentGameTitle" class="text-xl font-bold text-indigo-400">Game Window</h2>
            <button onclick="closeGame()" class="px-4 py-2 rounded-lg bg-rose-600/20 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white transition font-bold flex items-center space-x-2">
                <i class="fa-solid fa-xmark"></i>
                <span>Chiqish / Exit</span>
            </button>
        </div>
        
        <!-- O'yin oynasi -->
        <div class="flex-grow p-2 flex items-center justify-center overflow-hidden" id="gameContainer">
            <!-- game1.html yoki game2.html iframe orqali yuklanadi -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center p-6 text-slate-500 text-sm border-t border-slate-800/50">
        <p>&copy; 2026 Game Portal.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        const games = {
            'uz': {
                title: "🇺🇿 O'zbekcha O'yin",
                content: `<iframe src="game1.html" class="w-full h-full rounded-xl border-0 bg-white"></iframe>`
            },
            'en': {
                title: "🇬🇧 English Game",
                content: `<iframe src="game2.html" class="w-full h-full rounded-xl border-0 bg-white"></iframe>`
            }
        };

        function startGame(lang) {
            const modal = document.getElementById('gameModal');
            const container = document.getElementById('gameContainer');
            const title = document.getElementById('currentGameTitle');

            if (games[lang]) {
                title.innerText = games[lang].title;
                container.innerHTML = games[lang].content;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            const container = document.getElementById('gameContainer');

            modal.classList.add('hidden');
            modal.classList.remove('flex');
            container.innerHTML = '';
        }
    </script>
</body>
</html>
