<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Apple Puzzle & Shop</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 480px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #444;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #1a1a1a;
            border-bottom: 2px solid #333;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .coin-val { color: #ffd700; }
        .level-val { color: #4caf50; }

        .head-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .head-btn:hover { background: #444; }

        /* Canvas Wrap */
        .canvas-wrapper {
            position: relative;
            width: 480px;
            height: 400px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }
        #gameCanvas {
            background: #87CEEB;
            transition: background 0.5s;
            z-index: 1;
        }
        #particle-canvas {
            pointer-events: none;
            z-index: 5;
        }

        /* Control Panel */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 15px;
            background: #181818;
        }
        .btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: #3d3d3d; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-action { background: #d97706; border-color: #f59e0b; }
        .btn-action:hover { background: #b45309; }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }
        .hidden { display: none !important; }

        .title { font-size: 24px; margin-top: 0; margin-bottom: 15px; color: #4caf50; text-align: center; }
        
        /* Shop Styles */
        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 8px 14px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active { background: #4caf50; border-color: #81c784; }

        .shop-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 230px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .shop-item {
            background: #282828;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .buy-btn {
            width: 100%;
            padding: 6px;
            background: #2196f3;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .buy-btn.equipped { background: #4caf50; }
        .buy-btn:disabled { opacity: 0.8; cursor: default; }

        .close-btn {
            margin-top: 15px;
            width: 100%;
            background: #e53935;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="stats">
            <div>Bosqich: <span id="lvl-num" class="level-val">1</span></div>
            <div>Tangalar: <span id="coin-num" class="coin-val">0</span> 🪙</div>
        </div>
        <div>
            <button class="head-btn" onclick="openShop()">🏪 Do'kon</button>
            <button class="head-btn" onclick="openDaily()">📅 Kunlik</button>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="480" height="400"></canvas>
        <canvas id="particle-canvas" width="480" height="400"></canvas>

        <!-- Shop Overlay -->
        <div id="shop-overlay" class="overlay hidden">
            <h2 class="title">🏪 Do'kon</h2>
            <div class="shop-tabs">
                <button class="tab-btn active" onclick="switchShopTab('food', event)">Mevalar</button>
                <button class="tab-btn" onclick="switchShopTab('bg', event)">Fonlar</button>
                <button class="tab-btn" onclick="switchShopTab('portal', event)">Portallar</button>
            </div>
            <div id="shop-list" class="shop-items"></div>
            <button class="close-btn" onclick="closeShop()">Yopish</button>
        </div>

        <!-- Daily Reward Overlay -->
        <div id="daily-overlay" class="overlay hidden">
            <h2 class="title">📅 Kunlik Sovg'a</h2>
            <p id="daily-msg" style="text-align: center; margin-bottom: 20px;">Bugungi mukofotingizni oling!</p>
            <button id="claim-btn" class="btn btn-action" style="width: 100%;" onclick="claimDaily()">🎁 50 Tanga Olish</button>
            <button class="close-btn" onclick="closeDaily()">Yopish</button>
        </div>

        <!-- Win Overlay -->
        <div id="win-overlay" class="overlay hidden">
            <h2 class="title">🎉 G'alaba!</h2>
            <p>Ajoyib! Bosqichdan muvaffaqiyatli o'tdingiz!</p>
            <p style="font-size: 18px;">Mukofot: <span id="win-coins" class="coin-val">+20</span> 🪙</p>
            <button class="btn btn-action" style="width: 100%; margin-top: 10px;" onclick="nextLevel()">Keyingi Bosqich ➡️</button>
        </div>
    </div>

    <div class="controls">
        <div></div>
        <button class="btn" onclick="moveSnake('up')">⬆️</button>
        <div></div>
        <button class="btn" onclick="moveSnake('left')">⬅️</button>
        <button class="btn btn-action" onclick="resetLevel()">🔄</button>
        <button class="btn" onclick="moveSnake('right')">➡️</button>
        <div></div>
        <button class="btn" onclick="moveSnake('down')">⬇️</button>
        <div></div>
    </div>
</div>

<script>
// --- O'YIN SOZLAMALARI ---
const GRID_SIZE = 40;
const COLS = 12;
const ROWS = 10;

let coins = parseInt(localStorage.getItem('snake_coins')) || 0;
let currentLevelIdx = parseInt(localStorage.getItem('snake_level')) || 0;
let lastDailyClaim = localStorage.getItem('snake_daily') || '';

// Shop xaridlari saqlanishi
let inventory = JSON.parse(localStorage.getItem('snake_inventory')) || {
    food: ['apple'],
    bg: ['sky'],
    portal: ['classic']
};
let equipped = JSON.parse(localStorage.getItem('snake_equipped')) || {
    food: 'apple',
    bg: 'sky',
    portal: 'classic'
};

const shopItems = {
    food: [
        { id: 'apple', name: 'Olma', icon: '🍎', price: 0 },
        { id: 'banana', name: 'Banan', icon: '🍌', price: 30 },
        { id: 'orange', name: 'Apelsin', icon: '🍊', price: 50 },
        { id: 'watermelon', name: 'Tarvuz', icon: '🍉', price: 100 }
    ],
    bg: [
        { id: 'sky', name: 'Kunduzgi', color: '#87CEEB', price: 0 },
        { id: 'night', name: 'Tungi', color: '#1a1a3a', price: 40 },
        { id: 'sunset', name: 'Quyosh botishi', color: '#ff7e5f', price: 70 },
        { id: 'cyber', name: 'Kiber', color: '#2b003b', price: 120 }
    ],
    portal: [
        { id: 'classic', name: 'Klassik', icon: '🌀', price: 0 },
        { id: 'fire', name: 'Olovli', icon: '🔥', price: 50 },
        { id: 'galaxy', name: 'Galaktika', icon: '🌌', price: 90 }
    ]
};

// --- BOSQICHLAR (Levels) ---
const levels = [
    // 1-Bosqich
    {
        snake: [{x: 2, y: 3}, {x: 1, y: 3}],
        food: {x: 4, y: 6},
        portal: {x: 9, y: 3},
        blocks: [
            {x: 1, y: 4}, {x: 2, y: 4}, {x: 3, y: 4},
            {x: 7, y: 4}, {x: 8, y: 4}, {x: 9, y: 4}
        ]
    },
    // 2-Bosqich
    {
        snake: [{x: 1, y: 2}, {x: 1, y: 1}],
        food: {x: 5, y: 2},
        portal: {x: 10, y: 8},
        blocks: [
            {x: 0, y: 3}, {x: 1, y: 3}, {x: 2, y: 3}, {x: 3, y: 3}, {x: 4, y: 3}, {x: 5, y: 3},
            {x: 5, y: 6}, {x: 6, y: 6}, {x: 7, y: 6}, {x: 8, y: 6}, {x: 9, y: 6}, {x: 10, y: 6}
        ]
    },
    // 3-Bosqich
    {
        snake: [{x: 2, y: 1}, {x: 1, y: 1}],
        food: {x: 2, y: 5},
        portal: {x: 9, y: 1},
        blocks: [
            {x: 1, y: 2}, {x: 2, y: 2}, {x: 3, y: 2},
            {x: 5, y: 4}, {x: 6, y: 4}, {x: 7, y: 4},
            {x: 8, y: 2}, {x: 9, y: 2}, {x: 10, y: 2}
        ]
    }
];

let snake = [];
let food = {x: 0, y: 0};
let portal = {x: 0, y: 0};
let blocks = [];
let hasEaten = false;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const particleCanvas = document.getElementById('particle-canvas');
const pCtx = particleCanvas.getContext('2d');

// --- O'YIN KODI ---
function loadLevel(idx) {
    if (idx >= levels.length) {
        alert("Tabriklaymiz! Barcha mavjud bosqichlarni muvaffaqiyatli tugatdingiz!");
        currentLevelIdx = 0;
    }
    const lvl = levels[currentLevelIdx];
    snake = JSON.parse(JSON.stringify(lvl.snake));
    food = {...lvl.food};
    portal = {...lvl.portal};
    blocks = [...lvl.blocks];
    hasEaten = false;
    
    updateUI();
    applyGravity();
    draw();
}

function updateUI() {
    document.getElementById('lvl-num').innerText = currentLevelIdx + 1;
    document.getElementById('coin-num').innerText = coins;
    
    // Fon rangini yangilash
    const activeBg = shopItems.bg.find(b => b.id === equipped.bg);
    canvas.style.background = activeBg ? activeBg.color : '#87CEEB';
    
    // Malumotlarni saqlash
    localStorage.setItem('snake_coins', coins);
    localStorage.setItem('snake_level', currentLevelIdx);
    localStorage.setItem('snake_inventory', JSON.stringify(inventory));
    localStorage.setItem('snake_equipped', JSON.stringify(equipped));
}

function applyGravity() {
    let moved = true;
    while (moved) {
        moved = false;
        let canFall = true;
        for (let seg of snake) {
            let nextY = seg.y + 1;
            if (nextY >= ROWS || isBlockAt(seg.x, nextY) || (isSnakeAt(seg.x, nextY) && !isTail(seg.x, nextY))) {
                canFall = false;
                break;
            }
        }
        if (canFall) {
            for (let seg of snake) {
                seg.y += 1;
            }
            moved = true;
        }
    }
}

function isBlockAt(x, y) {
    return blocks.some(b => b.x === x && b.y === y);
}

function isSnakeAt(x, y) {
    return snake.some(s => s.x === x && s.y === y);
}

function isTail(x, y) {
    const tail = snake[snake.length - 1];
    return tail.x === x && tail.y === y;
}

function moveSnake(dir) {
    let head = {...snake[0]};
    if (dir === 'left') head.x -= 1;
    if (dir === 'right') head.x += 1;
    if (dir === 'up') head.y -= 1;
    if (dir === 'down') head.y += 1;

    // Devor va bloklar bilan to'qnashuv
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return;
    if (isBlockAt(head.x, head.y)) return;
    if (isSnakeAt(head.x, head.y) && !(head.x === snake[snake.length-1].x && head.y === snake[snake.length-1].y)) return;

    // Harakatlantirish
    snake.unshift(head);
    
    // Meva yeyish
    if (!hasEaten && head.x === food.x && head.y === food.y) {
        hasEaten = true;
    } else {
        snake.pop();
    }

    applyGravity();
    draw();

    // Portalga yetib borish (G'alaba)
    if (head.x === portal.x && head.y === portal.y) {
        winLevel();
    }
}

function resetLevel() {
    loadLevel(currentLevelIdx);
}

function winLevel() {
    const reward = 20 + (currentLevelIdx * 10);
    coins += reward;
    document.getElementById('win-coins').innerText = `+${reward}`;
    document.getElementById('win-overlay').classList.remove('hidden');
    triggerParticles();
    updateUI();
}

function nextLevel() {
    document.getElementById('win-overlay').classList.add('hidden');
    currentLevelIdx++;
    loadLevel(currentLevelIdx);
}

// --- TASVIRLASH (Drawing) ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Yer / To'siqlar (G'isht ko'rinishi)
    blocks.forEach(b => {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(b.x * GRID_SIZE, b.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
        ctx.strokeStyle = '#5c2d0c';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x * GRID_SIZE + 1, b.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
    });

    // 2. Meva (Shopda tanlangan meva)
    if (!hasEaten) {
        ctx.font = '28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const foodObj = shopItems.food.find(f => f.id === equipped.food);
        const foodIcon = foodObj ? foodObj.icon : '🍎';
        ctx.fillText(foodIcon, food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2);
    }

    // 3. Portal
    const portalObj = shopItems.portal.find(p => p.id === equipped.portal);
    const portalIcon = portalObj ? portalObj.icon : '🌀';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(portalIcon, portal.x * GRID_SIZE + GRID_SIZE/2, portal.y * GRID_SIZE + GRID_SIZE/2);

    // 4. Ilon
    snake.forEach((seg, index) => {
        if (index === 0) {
            // Ilon Boshi
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.arc(seg.x * GRID_SIZE + GRID_SIZE/2, seg.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Ko'zlar
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(seg.x * GRID_SIZE + 12, seg.y * GRID_SIZE + 14, 5, 0, Math.PI * 2);
            ctx.arc(seg.x * GRID_SIZE + 28, seg.y * GRID_SIZE + 14, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(seg.x * GRID_SIZE + 12, seg.y * GRID_SIZE + 14, 2, 0, Math.PI * 2);
            ctx.arc(seg.x * GRID_SIZE + 28, seg.y * GRID_SIZE + 14, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Ilon Tanasi
            ctx.fillStyle = '#8BC34A';
            ctx.beginPath();
            ctx.roundRect(seg.x * GRID_SIZE + 3, seg.y * GRID_SIZE + 3, GRID_SIZE - 6, GRID_SIZE - 6, 8);
            ctx.fill();
        }
    });
}

// --- DO'KON LOGIKASI (Shop) ---
let currentTab = 'food';

function openShop() {
    document.getElementById('shop-overlay').classList.remove('hidden');
    renderShop();
}

function closeShop() {
    document.getElementById('shop-overlay').classList.add('hidden');
}

function switchShopTab(tab, event) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if(event) event.target.classList.add('active');
    renderShop();
}

function renderShop() {
    const list = document.getElementById('shop-list');
    list.innerHTML = '';
    
    shopItems[currentTab].forEach(item => {
        const isBought = inventory[currentTab].includes(item.id);
        const isEquipped = equipped[currentTab] === item.id;
        
        const div = document.createElement('div');
        div.className = 'shop-item';
        
        let iconDisplay = item.icon ? `<span style="font-size:26px">${item.icon}</span>` : 
            `<div style="width:26px; height:26px; background:${item.color}; border-radius:50%; border:1px solid #fff;"></div>`;

        div.innerHTML = `
            ${iconDisplay}
            <div style="font-size:14px; font-weight:bold;">${item.name}</div>
            <button class="buy-btn ${isEquipped ? 'equipped' : ''}" 
                ${isEquipped ? 'disabled' : ''} 
                onclick="buyOrEquip('${currentTab}', '${item.id}', ${item.price})">
                ${isEquipped ? 'Tanlangan' : isBought ? 'Kiyish' : item.price + ' 🪙'}
            </button>
        `;
        list.appendChild(div);
    });
}

function buyOrEquip(type, id, price) {
    if (!inventory[type].includes(id)) {
        if (coins >= price) {
            coins -= price;
            inventory[type].push(id);
        } else {
            alert("Sizda tangalar yetarli emas!");
            return;
        }
    }
    equipped[type] = id;
    updateUI();
    renderShop();
    draw();
}

// --- KUNLIK MUKOFOT TIZIMI ---
function openDaily() {
    const overlay = document.getElementById('daily-overlay');
    overlay.classList.remove('hidden');
    
    const today = new Date().toDateString();
    const btn = document.getElementById('claim-btn');
    const msg = document.getElementById('daily-msg');

    if (lastDailyClaim === today) {
        btn.disabled = true;
        btn.innerText = "Bugun olib bo'lingan";
        msg.innerText = "Ertaga yana kelib mukofotingizni oling!";
    } else {
        btn.disabled = false;
        btn.innerText = "🎁 50 Tanga Olish";
        msg.innerText = "Bugungi tekin 50 tangangizni oling!";
    }
}

function closeDaily() {
    document.getElementById('daily-overlay').classList.add('hidden');
}

function claimDaily() {
    const today = new Date().toDateString();
    if (lastDailyClaim !== today) {
        coins += 50;
        lastDailyClaim = today;
        localStorage.setItem('snake_daily', today);
        updateUI();
        closeDaily();
        alert("Tabriklaymiz! 50 tanga berildi!");
    }
}

// --- ZARRACHALAR EFFEKTI (Particles) ---
let particles = [];
function triggerParticles() {
    particles = [];
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: particleCanvas.width / 2,
            y: particleCanvas.height / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            size: Math.random() * 5 + 3,
            life: 35
        });
    }
    animateParticles();
}

function animateParticles() {
    pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
    particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        pCtx.fill();
    });
    particles = particles.filter(p => p.life > 0);
    if (particles.length > 0) {
        requestAnimationFrame(animateParticles);
    }
}

// Keyboard / Klaviatura tugmalari
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveSnake('left');
    if (e.key === 'ArrowRight' || e.key === 'd') moveSnake('right');
    if (e.key === 'ArrowUp' || e.key === 'w') moveSnake('up');
    if (e.key === 'ArrowDown' || e.key === 's') moveSnake('down');
    if (e.key === 'r') resetLevel();
});

// Boshlanishi
loadLevel(currentLevelIdx);
</script>
</body>
</html>
